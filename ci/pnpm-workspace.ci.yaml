# CI 専用の pnpm 設定（m0-t2 設計 v1.3 §5.7。前例: MaplatCore/ci/pnpm-workspace.ci.yaml）
#
# pnpm 11 は allowBuilds を pnpm-workspace.yaml からしか読まず、既定 strictDepBuilds: true のため
# 未承認の build script（esbuild）があると ubuntu runner の pnpm install が
# ERR_PNPM_IGNORED_BUILDS で exit 1 になる（2026-09-05 run 33938324839 / 33938327355 で実測）。
# pnpm-workspace.yaml をリポジトリ直下に置くと pnpm がここを workspace ルートと判定するため
# 直下には置かず、CI の install 直前に cp する（.github/workflows/test.yml）。
#
# 中身の出自: CI（ubuntu / pnpm 11.25.0）の ERR_PNPM_IGNORED_BUILDS が報告したパッケージを全数採録した。
# 増減した場合は同じ手順（CI の報告値）で測り直すこと。macOS 本機ではこの警告が出ないため、本機の実測は根拠にならない。

allowBuilds:
  esbuild: true
